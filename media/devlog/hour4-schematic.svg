<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#141b24"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,139,253,0.07)" stroke-width="1"/>
  </pattern>
</defs>

<!-- bg -->
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>
<!-- vignette -->
<radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset="30%" stop-color="transparent"/><stop offset="100%" stop-color="rgba(0,0,0,0.7)"/></radialGradient>
<rect width="1920" height="1080" fill="url(#vig)"/>

<!-- ===== BOXES ===== -->
<!-- ESP32 center -->
<rect x="800" y="370" width="260" height="300" rx="8" fill="rgba(88,166,255,0.08)" stroke="#388bfd" stroke-width="2" filter="url(#glow)"/>
<text x="930" y="500" fill="#58a6ff" font-family="Courier New" font-size="26" font-weight="bold" text-anchor="middle">ESP32-S3</text>
<text x="930" y="530" fill="#8b949e" font-family="Courier New" font-size="16" text-anchor="middle">N16R8</text>
<text x="930" y="555" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">16MB flash · 8MB PSRAM</text>

<!-- ST7789 Display - top right -->
<rect x="1230" y="160" width="220" height="130" rx="6" fill="rgba(63,185,80,0.08)" stroke="#3fb950" stroke-width="2"/>
<text x="1340" y="215" fill="#3fb950" font-family="Courier New" font-size="20" font-weight="bold" text-anchor="middle">ST7789</text>
<text x="1340" y="240" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">2" IPS display</text>
<text x="1340" y="260" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 9–14  SPI2</text>

<!-- MAX98357A - top left -->
<rect x="460" y="160" width="220" height="130" rx="6" fill="rgba(210,153,34,0.08)" stroke="#d29922" stroke-width="2"/>
<text x="570" y="215" fill="#d29922" font-family="Courier New" font-size="20" font-weight="bold" text-anchor="middle">MAX98357A</text>
<text x="570" y="240" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">I²S amp</text>
<text x="570" y="260" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 4,5,6  I²S0</text>

<!-- DRV8833 - bottom right -->
<rect x="1230" y="750" width="220" height="130" rx="6" fill="rgba(247,129,102,0.08)" stroke="#f78166" stroke-width="2"/>
<text x="1340" y="805" fill="#f78166" font-family="Courier New" font-size="20" font-weight="bold" text-anchor="middle">DRV8833</text>
<text x="1340" y="830" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">motor driver</text>
<text x="1340" y="850" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 15–18  PWM</text>

<!-- VL53L0X - bottom left -->
<rect x="460" y="750" width="220" height="130" rx="6" fill="rgba(188,140,255,0.08)" stroke="#bc8cff" stroke-width="2"/>
<text x="570" y="805" fill="#bc8cff" font-family="Courier New" font-size="20" font-weight="bold" text-anchor="middle">VL53L0X</text>
<text x="570" y="830" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">ToF sensor</text>
<text x="570" y="850" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 7,8  I²C0</text>

<!-- Buttons -->
<rect x="730" y="830" width="180" height="80" rx="6" fill="rgba(121,192,255,0.08)" stroke="#79c0ff" stroke-width="2"/>
<text x="820" y="868" fill="#79c0ff" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">Buttons ×3</text>
<text x="820" y="892" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 1, 2, 21</text>

<!-- RGB LED -->
<rect x="990" y="830" width="180" height="80" rx="6" fill="rgba(255,123,114,0.08)" stroke="#ff7b72" stroke-width="2"/>
<text x="1080" y="868" fill="#ff7b72" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">RGB LED</text>
<text x="1080" y="892" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">GPIO 38, 47, 48</text>

<!-- Power bank - top center -->
<rect x="820" y="50" width="240" height="90" rx="6" fill="rgba(86,211,100,0.08)" stroke="#56d364" stroke-width="2"/>
<text x="940" y="90" fill="#56d364" font-family="Courier New" font-size="20" font-weight="bold" text-anchor="middle">USB Power Bank</text>
<text x="940" y="118" fill="#8b949e" font-family="Courier New" font-size="14" text-anchor="middle">5V · no charging circuit</text>

<!-- Speaker -->
<rect x="160" y="240" width="200" height="90" rx="6" fill="rgba(210,153,34,0.08)" stroke="#d29922" stroke-width="2"/>
<text x="260" y="283" fill="#d29922" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">Speaker</text>
<text x="260" y="308" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">40mm 4Ω 5W</text>

<!-- N20 motors -->
<rect x="1520" y="720" width="200" height="80" rx="6" fill="rgba(247,129,102,0.08)" stroke="#f78166" stroke-width="2"/>
<text x="1620" y="758" fill="#f78166" font-family="Courier New" font-size="18" font-weight="bold" text-anchor="middle">N20 ×2</text>
<text x="1620" y="782" fill="#8b949e" font-family="Courier New" font-size="12" text-anchor="middle">6V 200RPM</text>

<!-- ===== WIRES ===== -->
<!-- ESP32 to display (right) -->
<polyline points="1060,440 1145,440 1145,225 1230,225" fill="none" stroke="#3fb950" stroke-width="2" opacity="0.7"/>
<circle cx="1145" cy="440" r="4" fill="#3fb950"/>

<!-- ESP32 to amp (left) -->
<polyline points="800,450 715,450 715,225 680,225" fill="none" stroke="#d29922" stroke-width="2" opacity="0.7"/>
<circle cx="715" cy="450" r="4" fill="#d29922"/>

<!-- ESP32 to motor driver (right bottom) -->
<polyline points="1060,580 1145,580 1145,815 1230,815" fill="none" stroke="#f78166" stroke-width="2" opacity="0.7"/>
<circle cx="1145" cy="580" r="4" fill="#f78166"/>

<!-- ESP32 to VL53L0X (left bottom) -->
<polyline points="800,580 715,580 715,815 680,815" fill="none" stroke="#bc8cff" stroke-width="2" opacity="0.7"/>
<circle cx="715" cy="580" r="4" fill="#bc8cff"/>

<!-- ESP32 to buttons -->
<line x1="930" y1="670" x2="820" y2="830" stroke="#79c0ff" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>

<!-- ESP32 to RGB LED -->
<line x1="930" y1="670" x2="1080" y2="830" stroke="#ff7b72" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>

<!-- Power to ESP32 -->
<line x1="940" y1="140" x2="930" y2="370" stroke="#56d364" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>

<!-- Amp to speaker -->
<line x1="460" y1="280" x2="360" y2="285" stroke="#d29922" stroke-width="2" opacity="0.7"/>

<!-- Motor driver to N20 -->
<line x1="1450" y1="815" x2="1520" y2="760" stroke="#f78166" stroke-width="2" opacity="0.7"/>

<!-- ===== LABELS on wires ===== -->
<text x="1160" y="433" fill="#3fb950" font-family="Courier New" font-size="12">SPI2</text>
<text x="718" y="443" fill="#d29922" font-family="Courier New" font-size="12">I²S0</text>
<text x="1160" y="575" fill="#f78166" font-family="Courier New" font-size="12">PWM</text>
<text x="718" y="575" fill="#bc8cff" font-family="Courier New" font-size="12">I²C0</text>

<!-- ===== TITLE ===== -->
<text x="60" y="60" fill="#e6edf3" font-family="Courier New" font-size="38" font-weight="bold">buddy — schematic plan</text>
<text x="60" y="92" fill="#8b949e" font-family="Courier New" font-size="20">step 4 complete  ·  21 GPIO assigned  ·  0 conflicts</text>

<!-- hour badge -->
<rect x="1760" y="1020" width="140" height="50" rx="6" fill="rgba(56,139,253,0.15)" stroke="#388bfd" stroke-width="1"/>
<text x="1830" y="1043" fill="#388bfd" font-family="Courier New" font-size="22" font-weight="bold" text-anchor="middle">hour 4</text>
<text x="1830" y="1060" fill="#8b949e" font-family="Courier New" font-size="13" text-anchor="middle">pin map</text>
</svg>
